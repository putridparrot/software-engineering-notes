# Example production-style overrides for AKS. Images are pulled from ACR
# (attach it with: az aks update -g my-rg -n my-aks --attach-acr myregistry).
imageRegistry: myregistry.azurecr.io

web:
  image:
    tag: "1.4.2"

api:
  image:
    tag: "1.4.2"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20

redis:
  persistence:
    storageClass: managed-csi-premium
    size: 8Gi
