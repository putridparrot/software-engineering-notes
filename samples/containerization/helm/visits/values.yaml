# Default values for the visits chart.
# Override with -f my-values.yaml or --set key=value.

# Registry prefix for the web and api images, e.g. myregistry.azurecr.io.
# Empty means images built locally (Docker Desktop).
imageRegistry: ""
imagePullPolicy: IfNotPresent

web:
  replicaCount: 2
  image:
    repository: visits-web
    tag: ""                  # defaults to the chart's appVersion
  service:
    type: LoadBalancer       # ClusterIP when an Ingress sits in front
    port: 8000
  preStopSleepSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

api:
  replicaCount: 3
  image:
    repository: visits-api
    tag: ""                  # defaults to the chart's appVersion
  containerPort: 8080
  service:
    port: 8080
  # Environment variables. Values are rendered as templates, so they can refer
  # to names generated by the chart, such as the Redis service.
  env:
    ConnectionStrings__Redis: '{{ include "visits.redisHost" . }}:6379,abortConnect=false'
  probes:
    startupProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 2
      failureThreshold: 15
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
  preStopSleepSeconds: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  autoscaling:
    enabled: false           # needs metrics-server (included on AKS)
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

redis:
  image:
    repository: redis
    tag: 7-alpine
  persistence:
    enabled: true            # false = emptyDir, data lost when the pod is replaced
    size: 1Gi
    storageClass: ""         # empty = cluster default
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
