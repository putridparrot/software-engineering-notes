apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # never drop below 3 ready pods during a deployment
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true   # refuse to start if the image would run as root
      containers:
        - name: api
          # Built locally - in a real cluster this would be e.g. myregistry.azurecr.io/visits-api:1.0
          image: visits-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Redis
              value: "redis:6379,abortConnect=false"
          # Gives the app time to start before liveness checks begin
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          # Failing -> pod is removed from the Service (no traffic), but NOT restarted
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # Failing -> container is killed and restarted
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          # Keep serving for a few seconds after termination starts, while the pod is
          # removed from the Service endpoints - avoids dropped requests during rollouts
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
