# Overlay that runs the TypeScript/Node api instead of the .NET one.
# Everything else comes from the base in ../base.
#   kubectl apply -k k8s/node
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
images:
  - name: visits-api
    newName: visits-api-node
    newTag: "1.0"
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REDIS_URL
          value: redis://redis:6379
