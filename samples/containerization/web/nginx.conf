server {
    listen 80;

    # Docker's embedded DNS server. Re-resolving every few seconds means
    # requests are spread across all api replicas when it is scaled up.
    resolver 127.0.0.11 valid=5s;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # "api" is the service name from docker-compose.yml - Docker's internal DNS resolves it
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
    }
}
